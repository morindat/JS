<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 18 - JSON Practice</title>
</head>
<body>
  <h1>Users</h1>
  <ul id="user-list"></ul>

  <script>
    async function fetchAndStoreUsers() {
      try {
        // Step 1: Fetch users
        const response = await fetch("https://jsonplaceholder.typicode.com/users");
        const data = await response.json(); // this gives us an array of objects

        // Step 2: Store data in localStorage (must be string, so stringify)
        localStorage.setItem("users", JSON.stringify(data));

        // Step 3: Retrieve data back (to simulate usage later)
        const storedData = JSON.parse(localStorage.getItem("users"));

        // Step 4: Display names in the list
        const userList = document.getElementById("user-list");
        storedData.forEach(user => {
          const li = document.createElement("li");
          li.textContent = user.address;
          userList.appendChild(li);
        });

      } catch (error) {
        console.error("Error fetching users:", error);
      }
    }

    fetchAndStoreUsers();
  </script>
</body>
</html>
